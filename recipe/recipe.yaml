schema_version: 1

context:
  version: "0.1.2"
  python_min: "3.14"

recipe:
  name: quant-ranger
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/q/quant-ranger/quant_ranger-${{ version }}.tar.gz
    sha256: 16c998f3e194d8b12439d07f7d1517725e80b5a1552bd2569fee9ae2e2039d46
  - url: https://raw.githubusercontent.com/Quantco/quant-ranger/refs/tags/v${{ version }}/skills/create-custom-updater/SKILL.md
    sha256: cca10bdf839986dc3c64fa1667194ba97d4492e4f9725795d412ce743bbbcfca
    file_name: SKILL.md
    target_directory: skills/create-custom-updater

build:
  number: 0

outputs:
  - package:
      name: quant-ranger
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
      python:
        entry_points:
          - quant-ranger = quant_ranger.cli:main
    requirements:
      host:
        - python ${{ python_min }}.*
        - hatchling
        - pip
      run:
        - ${{ pin_subpackage("agent-skill-quant-ranger", exact=True) }}
        # pyproject.toml
        - python >=${{ python_min }}
        - copier >=9.8.0,<10
        - packaging >=26.2
        - pixi-diff-to-markdown >=0.3.3,<0.4.0
        - pydantic >=2.13.4,<3
        - pygithub >=2.9.1,<3
        - pyyaml >=6.0.3,<7
        - requests >=2.34.2,<3
        - rich >=15.0.0,<16
        - tomlkit >=0.15.0,<0.16.0
        - typer >=0.25.1,<0.26
        - urllib3 >=2.7.0,<3
        - zizmor ==1.22.0
        # pixi.toml
        - git >=2.54.0,<3
        - mergiraf >=0.17.0,<0.18.0
        - rattler-sandbox >=0.2.3,<0.3.0
    tests:
      - python:
          imports:
            - quant_ranger
          # conda-forge's zizmor ships no dist-info
          pip_check: false
          python_version:
            - ${{ python_min }}.*
            - '*'
      - requirements:
          run:
            - python ${{ python_min }}.*
        script:
          - quant-ranger --help
          - quant-ranger update --help

  - package:
      name: agent-skill-quant-ranger
    build:
      noarch: generic
      script:
        - mkdir -p $PREFIX/share/agent-skills/create-custom-updater
        - cp skills/create-custom-updater/SKILL.md $PREFIX/share/agent-skills/create-custom-updater/SKILL.md
    requirements:
      run_constraints:
        - quant-ranger ==${{ version }}
    tests:
      - package_contents:
          files:
            - share/agent-skills/create-custom-updater/SKILL.md
          strict: true
      - script:
          - agentskills validate $CONDA_PREFIX/share/agent-skills/create-custom-updater
        requirements:
          run:
            - skills-ref
    about:
      summary: Agent skill for creating quant-ranger custom updaters
      description: |
        Guides coding agents through writing, debugging, and running one-off
        quant-ranger custom updaters for repository migrations and audits.

about:
  summary: Tool for maintenance work across GitHub repositories.
  description: |
    Automated repository maintenance across GitHub organizations. quant-ranger
    discovers applicable work, runs typed update tasks in fresh checkouts, and
    can publish the results as pull requests.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/quantco/quant-ranger
  repository: https://github.com/quantco/quant-ranger
  documentation: https://ranger.quantco.cloud/

extra:
  recipe-maintainers:
    - pavelzw
    - ytausch
